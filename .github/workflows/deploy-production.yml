name: Deploy Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  PROJECT_ID: absolute-bonsai-492615-m7
  PROJECT_NUMBER: "386065163332"
  REGION: europe-west1
  SERVICE: tracebase-www
  WORKLOAD_IDENTITY_PROVIDER: projects/386065163332/locations/global/workloadIdentityPools/github-actions/providers/tracebase-production
  SERVICE_ACCOUNT: github-production-deployer@absolute-bonsai-492615-m7.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      TRACEBASE_PUBLIC_APP_URL: ${{ vars.TRACEBASE_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      TRACEBASE_DATABASE_URL: ${{ secrets.TRACEBASE_DATABASE_URL }}
      TRACEBASE_DB_NAME: ${{ vars.TRACEBASE_DB_NAME }}
      TRACEBASE_DB_USER: ${{ vars.TRACEBASE_DB_USER }}
      TRACEBASE_DB_PASSWORD: ${{ secrets.TRACEBASE_DB_PASSWORD }}
      TRACEBASE_CLOUDSQL_INSTANCE: ${{ vars.TRACEBASE_CLOUDSQL_INSTANCE }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Provision Cloud SQL and runtime identity
        if: ${{ env.TRACEBASE_DB_NAME != '' && env.TRACEBASE_DB_USER != '' && env.TRACEBASE_DB_PASSWORD != '' && env.TRACEBASE_CLOUDSQL_INSTANCE != '' && env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT != '' }}
        run: |
          DB_INSTANCE="${TRACEBASE_CLOUDSQL_INSTANCE##*:}"
          EFFECTIVE_RUNTIME_SERVICE_ACCOUNT="${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}"

          if [ -z "${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}" ] || ! gcloud iam service-accounts describe "${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            EFFECTIVE_RUNTIME_SERVICE_ACCOUNT="${SERVICE_ACCOUNT}"
          fi

          echo "EFFECTIVE_RUNTIME_SERVICE_ACCOUNT=${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}" >> "${GITHUB_ENV}"

          if ! gcloud services enable \
            sqladmin.googleapis.com \
            iam.googleapis.com \
            run.googleapis.com \
            --project="${PROJECT_ID}"; then
            echo "::warning::Unable to enable one or more required APIs with ${SERVICE_ACCOUNT}. Continuing under the assumption they are already enabled."
          fi

          if [ "${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}" != "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}" ]; then
            echo "::warning::Falling back to ${SERVICE_ACCOUNT} as the Cloud Run runtime identity because ${SERVICE_ACCOUNT} cannot create or bind a dedicated runtime service account."
          fi

          if ! gcloud sql instances describe "${DB_INSTANCE}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud sql instances create "${DB_INSTANCE}" \
              --project="${PROJECT_ID}" \
              --database-version=POSTGRES_16 \
              --edition=ENTERPRISE \
              --region="${REGION}" \
              --tier="db-custom-1-3840" \
              --storage-size=10 \
              --storage-type=SSD \
              --assign-ip \
              --connector-enforcement=REQUIRED \
              --deletion-protection \
              --server-ca-mode=GOOGLE_MANAGED_INTERNAL_CA \
              --quiet
          else
            gcloud sql instances patch "${DB_INSTANCE}" \
              --project="${PROJECT_ID}" \
              --connector-enforcement=REQUIRED \
              --quiet
          fi

          if ! gcloud sql databases describe "${TRACEBASE_DB_NAME}" --instance="${DB_INSTANCE}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud sql databases create "${TRACEBASE_DB_NAME}" \
              --instance="${DB_INSTANCE}" \
              --project="${PROJECT_ID}" \
              --quiet
          fi

          if gcloud sql users list --instance="${DB_INSTANCE}" --project="${PROJECT_ID}" --format="value(name)" | grep -qx "${TRACEBASE_DB_USER}"; then
            gcloud sql users set-password "${TRACEBASE_DB_USER}" \
              --instance="${DB_INSTANCE}" \
              --project="${PROJECT_ID}" \
              --password="${TRACEBASE_DB_PASSWORD}" \
              --quiet
          else
            gcloud sql users create "${TRACEBASE_DB_USER}" \
              --instance="${DB_INSTANCE}" \
              --project="${PROJECT_ID}" \
              --password="${TRACEBASE_DB_PASSWORD}" \
              --quiet
          fi

      - name: Prepare Cloud Run env files
        run: |
          if [ -z "${NEXT_PUBLIC_APP_URL}" ]; then
            echo "NEXT_PUBLIC_APP_URL is required." >&2
            exit 1
          fi

          if [ -z "${TRACEBASE_PUBLIC_APP_URL}" ]; then
            echo "TRACEBASE_PUBLIC_APP_URL is required." >&2
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi

          if [ -z "${CLERK_SECRET_KEY}" ]; then
            echo "CLERK_SECRET_KEY is required." >&2
            exit 1
          fi

          cat > /tmp/tracebase-build-env.yaml <<EOF
          NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
          TRACEBASE_PUBLIC_APP_URL: "${TRACEBASE_PUBLIC_APP_URL}"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
          EOF

          cat > /tmp/tracebase-service-env.yaml <<EOF
          NODE_ENV: "production"
          NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"
          TRACEBASE_PUBLIC_APP_URL: "${TRACEBASE_PUBLIC_APP_URL}"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
          CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
          EOF

          if [ -n "${TRACEBASE_DB_NAME}" ] && [ -n "${TRACEBASE_DB_USER}" ] && [ -n "${TRACEBASE_DB_PASSWORD}" ] && [ -n "${TRACEBASE_CLOUDSQL_INSTANCE}" ]; then
            cat >> /tmp/tracebase-service-env.yaml <<EOF
          TRACEBASE_DB_NAME: "${TRACEBASE_DB_NAME}"
          TRACEBASE_DB_USER: "${TRACEBASE_DB_USER}"
          TRACEBASE_DB_PASSWORD: "${TRACEBASE_DB_PASSWORD}"
          TRACEBASE_CLOUDSQL_INSTANCE: "${TRACEBASE_CLOUDSQL_INSTANCE}"
          TRACEBASE_INSTANCE_UNIX_SOCKET: "/cloudsql/${TRACEBASE_CLOUDSQL_INSTANCE}"
          EOF
          elif [ -n "${TRACEBASE_DATABASE_URL}" ]; then
            cat >> /tmp/tracebase-service-env.yaml <<EOF
          TRACEBASE_DATABASE_URL: "${TRACEBASE_DATABASE_URL}"
          DATABASE_URL: "${TRACEBASE_DATABASE_URL}"
          EOF
          else
            echo "::warning::No database runtime configuration is set. Control-plane state will fall back to ephemeral file storage on Cloud Run."
          fi

      - name: Deploy Cloud Run production service
        run: |
          EXTRA_ARGS=()

          EFFECTIVE_RUNTIME_SERVICE_ACCOUNT="${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT:-${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}}"

          if [ -n "${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}" ]; then
            EXTRA_ARGS+=("--service-account=${EFFECTIVE_RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ -n "${TRACEBASE_CLOUDSQL_INSTANCE}" ] && [ -n "${TRACEBASE_DB_NAME}" ] && [ -n "${TRACEBASE_DB_USER}" ] && [ -n "${TRACEBASE_DB_PASSWORD}" ]; then
            EXTRA_ARGS+=("--execution-environment=gen2")
            EXTRA_ARGS+=("--add-cloudsql-instances=${TRACEBASE_CLOUDSQL_INSTANCE}")
          fi

          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=./www \
            --build-env-vars-file=/tmp/tracebase-build-env.yaml \
            --env-vars-file=/tmp/tracebase-service-env.yaml \
            "${EXTRA_ARGS[@]}" \
            --no-invoker-iam-check \
            --quiet
